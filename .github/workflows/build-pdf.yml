name: Build PDF from Typst

on:
  push:
    branches:
      - master
    paths:
      - 'src/**/*.typ'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        
      - name: Build PDF from Typst sources
        run: |
          mkdir -p output
          typst compile src/Lecture-notes.typ output/Signals-and-systems-m1-tpe.pdf     

      - name: Install poppler-utils (pdftocairo)
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils

      - name: Convert first 2 pages of PDF to SVG
        run: |
          # Convert pages 1-2 to SVG files. pdftocairo produces files with suffix -1.svg and -2.svg
          pdftocairo -svg -f 1 -l 2 output/Signals-and-systems-m1-tpe.pdf output/Signals-and-systems-m1-tpe-page.svg
          # Normalize file names to predictable page1/page2 names
          if [ -f output/Signals-and-systems-m1-tpe-page-1.svg ]; then
            mv output/Signals-and-systems-m1-tpe-page-1.svg output/Signals-and-systems-m1-tpe-page1.svg
          fi
          if [ -f output/Signals-and-systems-m1-tpe-page-2.svg ]; then
            mv output/Signals-and-systems-m1-tpe-page-2.svg output/Signals-and-systems-m1-tpe-page2.svg
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true
