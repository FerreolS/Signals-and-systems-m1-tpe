name: Build PDF from Typst

on:
  push:
    branches:
      - master
    # paths:
    #   - 'src/**/*.typ'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name:  setup fontist
        uses: fontist/setup@v1
      
      - name: Setup Typst
        uses: typst-community/setup-typst@v3
        
      - name: Build PDF from Typst sources
        run: |
          fontist install "Fira Code"
          fontist install "Open Sans"
          typst compile src/Lecture-notes.typ Signals-and-systems-m1-tpe.pdf  --font-path ~/.fontist/fonts   

      - name: Install poppler-utils (pdf2svg)
        run: |
          sudo apt-get update
          sudo apt-get install -y pdf2svg

      - name: Convert first page from PDF to SVG
        run: | 
          pdf2svg Signals-and-systems-m1-tpe.pdf Signals-and-systems-m1-tpe.svg
          mkdir output
          mv *{.svg,.pdf} output/.

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: gh-pages
          force_orphan: true
